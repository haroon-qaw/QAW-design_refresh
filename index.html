    <!-- Panel: All flows -->
    <div id="panel-all-flows" class="tab-panel">

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <!-- Environment selector -->
        <button class="select-env">

          </button>
        </div>

        <!-- Sort -->
        <div class="sort-dropdown" id="sort-dropdown">
          <button class="sort-btn" id="sort-btn">
            <span id="sort-label">Bugs descending</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="sort-menu" id="sort-menu">
            <button class="sort-option selected" data-value="bugs-desc">Bugs descending</button>
            <button class="sort-option" data-value="name-asc">Name (A–Z)</button>
            <button class="sort-option" data-value="name-desc">Name (Z–A)</button>
          </div>
        </div>

        <!-- Icon buttons -->
        <div class="toolbar-icons">
          <button class="icon-btn" data-tooltip="Filter">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round"><path d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z"/></svg>

          </button>
        </div>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-outline" id="run-all-flows-btn">Run all flows</button>
